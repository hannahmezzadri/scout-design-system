<!doctype html>
<html lang="en" data-theme="light" data-density="default" data-brand="scout">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scout — Design System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Literata:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <button
        type="button"
        class="nav-toggle"
        id="nav-toggle"
        aria-label="Toggle navigation"
        aria-expanded="false"
        aria-controls="sidebar"
      >
        <span></span><span></span><span></span>
      </button>
      <div class="brand">
        <span class="title">Scout</span>
        <scout-badge type="informational" emphasis="low" size="condensed">BETA</scout-badge>
      </div>
      <div class="controls">
        <scout-dropdown-select id="brand" label="Brand" size="condensed" value="scout">
          <scout-dropdown-option value="scout">Scout</scout-dropdown-option>
          <scout-dropdown-option value="ember">Ember</scout-dropdown-option>
          <scout-dropdown-option value="snag">Snag</scout-dropdown-option>
          <scout-dropdown-option value="onward">Onward</scout-dropdown-option>
          <scout-dropdown-option value="acorn">Acorn</scout-dropdown-option>
          <scout-dropdown-option value="grub">Grub</scout-dropdown-option>
          <scout-dropdown-option value="huddle">Huddle</scout-dropdown-option>
          <scout-dropdown-option value="venture">Venture</scout-dropdown-option>
          <scout-dropdown-option value="embark">Embark</scout-dropdown-option>
          <scout-dropdown-option value="etch">Etch</scout-dropdown-option>
          <scout-dropdown-option value="owt">Owt</scout-dropdown-option>
        </scout-dropdown-select>
        <scout-dropdown-select id="theme" label="Theme" size="condensed" value="light">
          <scout-dropdown-option value="light">Light</scout-dropdown-option>
          <scout-dropdown-option value="dark">Dark</scout-dropdown-option>
        </scout-dropdown-select>
        <scout-dropdown-select id="density" label="Density" size="condensed" value="default">
          <scout-dropdown-option value="default">Default</scout-dropdown-option>
          <scout-dropdown-option value="condensed">Condensed</scout-dropdown-option>
        </scout-dropdown-select>
      </div>
    </header>

    <div class="layout">
      <div class="sidebar-scrim" id="sidebar-scrim" aria-hidden="true"></div>
      <aside class="sidebar" id="sidebar">
        <scout-accordion class="nav-accordion" mode="multi" size="sm">
          <scout-accordion-item label="Foundation" expanded>
            <scout-anchor-links id="nav-foundation" mode="manual" prevent-scroll></scout-anchor-links>
          </scout-accordion-item>

          <scout-accordion-item label="Tokens">
            <scout-anchor-links id="nav-tokens" mode="manual" prevent-scroll></scout-anchor-links>
          </scout-accordion-item>

          <scout-accordion-item label="Components">
            <scout-anchor-links id="nav-components" mode="manual" prevent-scroll></scout-anchor-links>
          </scout-accordion-item>

          <scout-accordion-item label="Patterns">
            <scout-anchor-links id="nav-patterns" mode="manual" prevent-scroll></scout-anchor-links>
          </scout-accordion-item>

          <scout-accordion-item label="Templates">
            <scout-anchor-links id="nav-templates" mode="manual" prevent-scroll></scout-anchor-links>
          </scout-accordion-item>
        </scout-accordion>
      </aside>

      <main id="app"></main>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
