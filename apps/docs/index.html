<!doctype html>
<html lang="en" data-theme="light" data-density="default" data-brand="connex">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connex — Design System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Literata:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <button
        type="button"
        class="nav-toggle"
        id="nav-toggle"
        aria-label="Toggle navigation"
        aria-expanded="false"
        aria-controls="sidebar"
      >
        <span></span><span></span><span></span>
      </button>
      <div class="brand">
        <span class="title">Connex</span>
        <connex-badge type="informational" emphasis="low" size="condensed">BETA</connex-badge>
      </div>
      <div class="controls">
        <connex-dropdown-select id="brand" label="Brand" size="condensed" value="connex">
          <connex-dropdown-option value="connex">Connex</connex-dropdown-option>
          <connex-dropdown-option value="empath">Empath</connex-dropdown-option>
          <connex-dropdown-option value="sage">Sage</connex-dropdown-option>
          <connex-dropdown-option value="onecomm">OneComm</connex-dropdown-option>
          <connex-dropdown-option value="athena">Athena</connex-dropdown-option>
          <connex-dropdown-option value="graffiti">Graffiti</connex-dropdown-option>
          <connex-dropdown-option value="hubble">Hubble</connex-dropdown-option>
          <connex-dropdown-option value="voyant">Voyant</connex-dropdown-option>
          <connex-dropdown-option value="echo">ECHO</connex-dropdown-option>
          <connex-dropdown-option value="e4a">E4A</connex-dropdown-option>
          <connex-dropdown-option value="eno">Eno</connex-dropdown-option>
        </connex-dropdown-select>
        <connex-dropdown-select id="theme" label="Theme" size="condensed" value="light">
          <connex-dropdown-option value="light">Light</connex-dropdown-option>
          <connex-dropdown-option value="dark">Dark</connex-dropdown-option>
        </connex-dropdown-select>
        <connex-dropdown-select id="density" label="Density" size="condensed" value="default">
          <connex-dropdown-option value="default">Default</connex-dropdown-option>
          <connex-dropdown-option value="condensed">Condensed</connex-dropdown-option>
        </connex-dropdown-select>
      </div>
    </header>

    <div class="layout">
      <div class="sidebar-scrim" id="sidebar-scrim" aria-hidden="true"></div>
      <aside class="sidebar" id="sidebar">
        <connex-accordion class="nav-accordion" mode="multi" size="sm">
          <connex-accordion-item label="Foundation" expanded>
            <connex-anchor-links id="nav-foundation" mode="manual" prevent-scroll></connex-anchor-links>
          </connex-accordion-item>

          <connex-accordion-item label="Tokens">
            <connex-anchor-links id="nav-tokens" mode="manual" prevent-scroll></connex-anchor-links>
          </connex-accordion-item>

          <connex-accordion-item label="Components">
            <connex-anchor-links id="nav-components" mode="manual" prevent-scroll></connex-anchor-links>
          </connex-accordion-item>

          <connex-accordion-item label="Patterns">
            <connex-anchor-links id="nav-patterns" mode="manual" prevent-scroll></connex-anchor-links>
          </connex-accordion-item>

          <connex-accordion-item label="Templates">
            <connex-anchor-links id="nav-templates" mode="manual" prevent-scroll></connex-anchor-links>
          </connex-accordion-item>
        </connex-accordion>
      </aside>

      <main id="app"></main>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
